services:
  postgres:
    image: postgres:16
    container_name: tovila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tovila
      POSTGRES_PASSWORD: tovila
      POSTGRES_DB: tovila
    ports:
      - "5432:5432"
    volumes:
      - tovila_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tovila -d tovila"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tovila_pgdata:
